<script>
const FEISHU_CONFIG = {
  // ===== 在此处替换你的飞书应用凭证 =====
  appId:     'cli_xxxxxxxxxxxxxxxx',    // 🔴 替换为你的飞书 App ID（飞书开放平台 → 应用 → 凭证与基础信息）
  appSecret: 'xxxxxxxxxxxxxxxxxxxxxxxx', // 🔴 替换为你的飞书 App Secret（⚠️ 生产环境必须放后端！）
  // ===== 在此处替换你的多维表格信息 =====
  baseId:    'bascnXXXXXXXXXXXXXXXX',   // 🔴 替换为多维表格 BaseId（多维表格URL中 /base/ 后面的字符串）
  assetTableId:  'tblXXXXXXXXXXXXXXXX', // 🔴 替换为「标的表」TableId
  dividendTableId: 'tblYYYYYYYYYYYYYYYY', // 🔴 替换为「分红表」TableId
  // ===== API地址（一般不需要修改） =====
  baseUrl: 'https://open.feishu.cn/open-apis'
};

/*
  ============================================================
  ⚠️ 鉴权说明（重要）
  ============================================================
  本页面通过 tenant_access_token 鉴权访问飞书API：
  1. 用 appId + appSecret 换取 tenant_access_token（有效期2小时）
  2. 所有后续请求携带 Authorization: Bearer {token}

  🔴 生产环境建议：
     - 不要把 appSecret 写在前端代码中（会被任何人看到）
     - 建议搭建简易后端（如 Serverless Function），由后端持有密钥并转发请求
     - 前端只调用你自己的后端接口，后端再请求飞书API
     - Vercel Serverless Functions / 云函数 / Nginx 反代均可实现

  飞书鉴权文档：
  https://open.feishu.cn/document/server-docs/authentication-management/access-token/tenant_access_token_internal
  ============================================================
*/
</script>

<script>
// ============================================================
//  工具函数
// ============================================================

function showToast(msg, type = 'success') {
  const colors = {
    success: 'bg-emerald-500',
    error: 'bg-red-500',
    warning: 'bg-amber-500',
    info: 'bg-blue-500'
  };
  const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast-enter ${colors[type]} text-white px-4 py-3 rounded-lg shadow-lg text-sm flex items-center gap-2 min-w-[240px]`;
  el.innerHTML = `<span>${icons[type]}</span><span>${msg}</span>`;
  container.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 3000);
}

function openModal(title, bodyHtml, footerHtml) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalFooter').innerHTML = footerHtml || '';
  const overlay = document.getElementById('modalOverlay');
  overlay.classList.remove('hidden');
  overlay.classList.add('flex');
}

function closeModal() {
  const overlay = document.getElementById('modalOverlay');
  overlay.classList.add('hidden');
  overlay.classList.remove('flex');
}

// 数字输入校验：只允许数字和小数点
function numberOnly(el) {
  el.value = el.value.replace(/[^\d.]/g, '').replace(/\.{2,}/g, '.').replace(/^(\d*\.\d*)\./g, '$1');
}

function fmtNum(v) {
  if (v === null || v === undefined || v === '') return '—';
  return Number(v).toLocaleString('zh-CN');
}

function fmtDate(v) {
  if (!v) return '—';
  try { return new Date(v).toLocaleDateString('zh-CN'); } catch { return v; }
}

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

// ============================================================
//  飞书 API 模块
//  📌 飞书多维表格API文档：https://open.feishu.cn/document/server-docs/docs/bitable-v1/bitable-overview
//
//  ⚠️ 鉴权说明：
//     当前通过 tenant_access_token 鉴权（appId + appSecret → token）。
//     生产环境建议后端中转API，避免密钥暴露在前端。
//     参考：https://open.feishu.cn/document/server-docs/authentication-management/access-token/tenant_access_token_internal
// ============================================================

const FeishuAPI = {
  token: null,
  tokenExpiry: 0,

  // 获取配置（优先使用 localStorage 中保存的）
  getCfg() {
    const saved = JSON.parse(localStorage.getItem('feishu_cfg') || '{}');
    return {
      appId: saved.appId || FEISHU_CONFIG.appId,
      appSecret: saved.appSecret || FEISHU_CONFIG.appSecret,
      baseId: saved.baseId || FEISHU_CONFIG.baseId,
      assetTableId: saved.assetTableId || FEISHU_CONFIG.assetTableId,
      dividendTableId: saved.dividendTableId || FEISHU_CONFIG.dividendTableId,
      baseUrl: FEISHU_CONFIG.baseUrl
    };
  },

  // 获取 tenant_access_token
  // 📌 文档：https://open.feishu.cn/document/server-docs/authentication-management/access-token/tenant_access_token_internal
  async getToken() {
    if (this.token && Date.now() < this.tokenExpiry) return this.token;

    const cfg = this.getCfg();
    // ⚠️ 鉴权逻辑：用 appId + appSecret 换取 token
    //    生产环境应由后端完成此步骤，前端只调用后端接口
    const resp = await fetch(`${cfg.baseUrl}/auth/v3/tenant_access_token/internal`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        app_id: cfg.appId,
        app_secret: cfg.appSecret
      })
    });
    const data = await resp.json();
    if (data.code !== 0) throw new Error(`获取token失败: ${data.msg} (code=${data.code})`);
    this.token = data.tenant_access_token;
    this.tokenExpiry = Date.now() + (data.expire - 300) * 1000; // 提前5分钟过期
    return this.token;
  },

  // 通用请求封装
  async request(method, path, body = null) {
    const token = await this.getToken();
    const cfg = this.getCfg();
    const opts = {
      method,
      headers: {
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json'
      }
    };
    if (body) opts.body = JSON.stringify(body);
    const resp = await fetch(`${cfg.baseUrl}${path}`, opts);
    const data = await resp.json();
    if (data.code !== 0) throw new Error(`API错误: ${data.msg} (code=${data.code})`);
    return data.data;
  },

  // ===== 标的表 CRUD =====
  // 📌 新增记录：https://open.feishu.cn/document/server-docs/docs/bitable-v1/app-table-record/create
  // 📌 查询记录：https://open.feishu.cn/document/server-docs/docs/bitable-v1/app-table-record/search
  // 📌 更新记录：https://open.feishu.cn/document/server-docs/docs/bitable-v1/app-table-record/update
  // 📌 删除记录：https://open.feishu.cn/document/server-docs/docs/bitable-v1/app-table-record/delete

  async listAssets() {
    const cfg = this.getCfg();
    const data = await this.request('POST',
      `/bitable/v1/apps/${cfg.baseId}/tables/${cfg.assetTableId}/records/search`,
      { page_size: 500 }
    );
    return (data.items || []).map(r => ({ recordId: r.record_id, fields: r.fields }));
  },

  async createAsset(fields) {
    const cfg = this.getCfg();
    return this.request('POST',
      `/bitable/v1/apps/${cfg.baseId}/tables/${cfg.assetTableId}/records`,
      { fields }
    );
  },

  async updateAsset(recordId, fields) {
    const cfg = this.getCfg();
    return this.request('PUT',
      `/bitable/v1/apps/${cfg.baseId}/tables/${cfg.assetTableId}/records/${recordId}`,
      { fields }
    );
  },

  async deleteAsset(recordId) {
    const cfg = this.getCfg();
    return this.request('DELETE',
      `/bitable/v1/apps/${cfg.baseId}/tables/${cfg.assetTableId}/records/${recordId}`
    );
  },

  // ===== 分红表 CRUD =====
  async listDividends() {
    const cfg = this.getCfg();
    const data = await this.request('POST',
      `/bitable/v1/apps/${cfg.baseId}/tables/${cfg.dividendTableId}/records/search`,
      { page_size: 500 }
    );
    return (data.items || []).map(r => ({ recordId: r.record_id, fields: r.fields }));
  },

  async createDividend(fields) {
    const cfg = this.getCfg();
    return this.request('POST',
      `/bitable/v1/apps/${cfg.baseId}/tables/${cfg.dividendTableId}/records`,
      { fields }
    );
  },

  async updateDividend(recordId, fields) {
    const cfg = this.getCfg();
    return this.request('PUT',
      `/bitable/v1/apps/${cfg.baseId}/tables/${cfg.dividendTableId}/records/${recordId}`,
      { fields }
    );
  },

  async deleteDividend(recordId) {
    const cfg = this.getCfg();
    return this.request('DELETE',
      `/bitable/v1/apps/${cfg.baseId}/tables/${cfg.dividendTableId}/records/${recordId}`
    );
  },

  // 测试连接
  async testConnection() {
    await this.getToken();
    await this.listAssets();
    return true;
  }
};

// ============================================================
//  全局状态
// ============================================================
let currentPage = 'dashboard';
let assetsData = [];
let dividendsData = [];

const STATUS_MAP = {
  '在投': 'bg-blue-100 text-blue-700',
  '部分退出': 'bg-amber-100 text-amber-700',
  '完全退出': 'bg-gray-200 text-gray-600',
  '风险预警': 'bg-red-100 text-red-700'
};

const DIVIDEND_TYPES = ['现金分红', '转增股本', '其他'];
const PROJECT_STATUSES = ['在投', '部分退出', '完全退出', '风险预警'];
const ROUNDS = ['种子轮','天使轮','Pre-A轮','A轮','A+轮','Pre-B轮','B轮','B+轮','C轮','D轮','Pre-IPO'];

// ============================================================
//  页面路由
// ============================================================
const PAGE_TITLES = {
  dashboard: '投后看板',
  assets: '标的台账',
  dividends: '分红管理',
  config: '系统配置'
};

function navigateTo(page, e) {
  if (e) e.preventDefault();
  currentPage = page;
  document.querySelectorAll('.sidebar-link').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });
  document.getElementById('pageTitle').textContent = PAGE_TITLES[page] || page;
  renderPage();
}

function renderPage() {
  const container = document.getElementById('pageContent');
  switch (currentPage) {
    case 'dashboard': renderDashboard(container); break;
    case 'assets': renderAssets(container); break;
    case 'dividends': renderDividends(container); break;
    case 'config': renderConfig(container); break;
  }
}

// ============================================================
//  数据加载
// ============================================================
async function refreshData() {
  try {
    showToast('正在从飞书加载数据...', 'info');
    const [assets, dividends] = await Promise.all([
      FeishuAPI.listAssets(),
      FeishuAPI.listDividends()
    ]);
    assetsData = assets;
    dividendsData = dividends;
    updateConnStatus(true);
    showToast(`数据加载完成：标的 ${assets.length} 条，分红 ${dividends.length} 条`);
    renderPage();
  } catch (err) {
    updateConnStatus(false);
    showToast(`数据加载失败: ${err.message}`, 'error');
  }
}

function updateConnStatus(connected) {
  const el = document.getElementById('connStatus');
  if (connected) {
    el.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400"></span> 已连接飞书';
    el.className = 'flex items-center gap-2 text-emerald-300 text-xs';
  } else {
    el.innerHTML = '<span class="w-2 h-2 rounded-full bg-red-400"></span> 连接失败';
    el.className = 'flex items-center gap-2 text-red-300 text-xs';
  }
}

// ============================================================
//  投后看板
// ============================================================
function renderDashboard(container) {
  const totalInvest = assetsData.reduce((s, a) => s + (Number(a.fields['投资金额']) || 0), 0);
  const activeCount = assetsData.filter(a => a.fields['项目状态'] === '在投').length;
  const warningCount = assetsData.filter(a => a.fields['项目状态'] === '风险预警').length;
  const totalDividend = dividendsData.reduce((s, d) => s + (Number(d.fields['分红金额']) || 0), 0);

  // 行业分布
  const industryMap = {};
  assetsData.forEach(a => {
    const ind = a.fields['行业'] || '其他';
    industryMap[ind] = (industryMap[ind] || 0) + 1;
  });

  // 状态分布
  const statusMap = {};
  assetsData.forEach(a => {
    const st = a.fields['项目状态'] || '其他';
    statusMap[st] = (statusMap[st] || 0) + 1;
  });

  container.innerHTML = `
    <div class="fade-in space-y-6">
      <!-- 统计卡片 -->
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-200">
          <div class="flex items-center gap-3">
            <div class="w-11 h-11 bg-blue-50 rounded-lg flex items-center justify-center text-xl">📋</div>
            <div>
              <div class="text-2xl font-bold text-gray-800">${assetsData.length}</div>
              <div class="text-sm text-gray-500">标的总数</div>
            </div>
          </div>
        </div>
        <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-200">
          <div class="flex items-center gap-3">
            <div class="w-11 h-11 bg-blue-50 rounded-lg flex items-center justify-center text-xl">💰</div>
            <div>
              <div class="text-2xl font-bold text-gray-800">${fmtNum(totalInvest)}<span class="text-sm font-normal">万</span></div>
              <div class="text-sm text-gray-500">投资总额</div>
            </div>
          </div>
        </div>
        <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-200">
          <div class="flex items-center gap-3">
            <div class="w-11 h-11 bg-emerald-50 rounded-lg flex items-center justify-center text-xl">🎯</div>
            <div>
              <div class="text-2xl font-bold text-gray-800">${activeCount}</div>
              <div class="text-sm text-gray-500">在投项目</div>
            </div>
          </div>
        </div>
        <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-200">
          <div class="flex items-center gap-3">
            <div class="w-11 h-11 ${warningCount > 0 ? 'bg-red-50' : 'bg-emerald-50'} rounded-lg flex items-center justify-center text-xl">⚠️</div>
            <div>
              <div class="text-2xl font-bold ${warningCount > 0 ? 'text-red-600' : 'text-gray-800'}">${warningCount}</div>
              <div class="text-sm text-gray-500">风险预警</div>
            </div>
          </div>
        </div>
      </div>

      <!-- 图表 -->
      <div class="grid lg:grid-cols-2 gap-6">
        <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-200">
          <h3 class="font-bold text-gray-800 mb-3">📊 行业分布</h3>
          <div style="height:260px"><canvas id="chartIndustry"></canvas></div>
        </div>
        <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-200">
          <h3 class="font-bold text-gray-800 mb-3">📈 项目状态分布</h3>
          <div style="height:260px"><canvas id="chartStatus"></canvas></div>
        </div>
      </div>

      <!-- 最近分红 -->
      <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-200">
        <h3 class="font-bold text-gray-800 mb-3">💰 分红概览</h3>
        <div class="grid grid-cols-2 gap-4">
          <div class="text-center p-4 bg-emerald-50 rounded-lg">
            <div class="text-2xl font-bold text-emerald-700">${fmtNum(totalDividend)}<span class="text-sm">万</span></div>
            <div class="text-sm text-gray-500">累计分红金额</div>
          </div>
          <div class="text-center p-4 bg-blue-50 rounded-lg">
            <div class="text-2xl font-bold text-blue-700">${dividendsData.length}</div>
            <div class="text-sm text-gray-500">分红记录数</div>
          </div>
        </div>
      </div>
    </div>
  `;

  setTimeout(() => {
    renderIndustryChart(industryMap);
    renderStatusChart(statusMap);
  }, 100);
}

function renderIndustryChart(data) {
  const ctx = document.getElementById('chartIndustry');
  if (!ctx) return;
  new Chart(ctx, {
    type: 'doughnut',

async function saveAsset(recordId) {
  const name = document.getElementById('af_name').value.trim();
  const amount = document.getElementById('af_amount').value.trim();

  // 表单校验
  if (!name) { showToast('请输入项目名称', 'warning'); return; }
  if (!amount || isNaN(Number(amount))) { showToast('请输入正确的投资金额（数字）', 'warning'); return; }

  const fields = {
    '项目名称': name,
    '行业': document.getElementById('af_industry').value.trim(),
    '投资轮次': document.getElementById('af_round').value,
    '投资金额': Number(amount),
    '持股比例': Number(document.getElementById('af_equity').value) || null,
    '投资日期': document.getElementById('af_date').value ? new Date(document.getElementById('af_date').value).getTime() : null,
    '标的对接人': document.getElementById('af_contact').value.trim(),
    '项目状态': document.getElementById('af_status').value,
    '会计核算方法': document.getElementById('af_accounting').value.trim(),
    '备注': document.getElementById('af_note').value.trim()
  };

  try {
    if (recordId) {
      await FeishuAPI.updateAsset(recordId, fields);
      showToast('标的更新成功');
    } else {
      await FeishuAPI.createAsset(fields);
      showToast('标的新增成功');
    }
    closeModal();
    await refreshData();
  } catch (err) {
    showToast(`保存失败: ${err.message}`, 'error');
  }
}

function confirmDeleteAsset(recordId) {

          <li>• <a href="https://open.feishu.cn/document/server-docs/authentication-management/access-token/tenant_access_token_internal" target="_blank" class="underline">获取 tenant_access_token</a></li>
          <li>• <a href="https://open.feishu.cn/document/server-docs/docs/bitable-v1/app-table-record/create" target="_blank" class="underline">新增记录</a></li>
          <li>• <a href="https://open.feishu.cn/document/server-docs/docs/bitable-v1/app-table-record/search" target="_blank" class="underline">查询记录</a></li>
        </ul>
      </div>

      <!-- 连接测试 -->
      <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-200">
        <h3 class="font-bold text-gray-800 mb-4">🔌 连接测试</h3>
        <button onclick="testConnection()" class="px-4 py-2 bg-primary-600 text-white rounded-lg text-sm hover:bg-primary-700">测试飞书连接</button>
        <div id="testResult" class="mt-3 text-sm"></div>
      </div>
    </div>
  `;
}

async function saveFeishuConfig() {
  const cfg = {
    appId: document.getElementById('cfg_appid').value.trim(),
    appSecret: document.getElementById('cfg_secret').value.trim(),
    baseId: document.getElementById('cfg_baseid').value.trim(),
    assetTableId: document.getElementById('cfg_asset_tbl').value.trim(),
    dividendTableId: document.getElementById('cfg_div_tbl').value.trim()
  };
  localStorage.setItem('feishu_cfg', JSON.stringify(cfg));
  showToast('飞书配置已保存，正在测试连接...');
  // 重置 token 使新配置生效
  FeishuAPI.token = null;
  FeishuAPI.tokenExpiry = 0;
  // 自动测试连接
  setTimeout(() => testConnection(), 500);
}

async function testConnection() {
  const result = document.getElementById('testResult');
  result.innerHTML = '<span class="text-gray-500">正在测试...</span>';
  try {
    await FeishuAPI.testConnection();
    result.innerHTML = '<span class="text-emerald-600">✅ 飞书连接成功！</span>';
    updateConnStatus(true);
    showToast('飞书连接成功');
  } catch (err) {
    result.innerHTML = `<span class="text-red-600">❌ 连接失败: ${err.message}</span>`;
    updateConnStatus(false);
    showToast('飞书连接失败', 'error');
  }
}

// ============================================================
//  初始化
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  // 绑定侧边栏导航
  document.querySelectorAll('.sidebar-link').forEach(el => {
    el.addEventListener('click', function(e) {
      navigateTo(this.dataset.page, e);
    });
  });

  // 更新时间
  function updateTime() {
    document.getElementById('currentTime').textContent = new Date().toLocaleString('zh-CN');
  }
  updateTime();
  setInterval(updateTime, 60000);

  // 渲染首页
  renderDashboard(document.getElementById('pageContent'));

  // 自动尝试连接
  setTimeout(() => { refreshData(); }, 500);
});

// ESC 关闭弹窗
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>股权投资投后管理系统</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
  <style>
/* ========================================
   投后智驾舱 - 深蓝数据可视化主题
   ======================================== */

:root {
  /* 深蓝主色板 */
  --bg-deep: #050b1a;
  --bg-dark: #0a1628;
  --bg-card: #0f1f38;
  --bg-card-hover: #142847;
  --bg-sidebar: #070e1f;
  --border-glow: rgba(56,189,248,.15);
  --border-subtle: rgba(148,163,184,.08);

  /* 强调色 */
  --primary: #38bdf8;
  --primary-dim: rgba(56,189,248,.15);
  --primary-glow: rgba(56,189,248,.3);
  --accent-cyan: #22d3ee;
  --accent-blue: #3b82f6;
  --accent-indigo: #818cf8;
  --accent-purple: #a78bfa;

  /* 语义色（暗底高亮） */
  --success: #34d399;
  --success-dim: rgba(52,211,153,.12);
  --warning: #fbbf24;
  --warning-dim: rgba(251,191,36,.12);
  --danger: #f87171;
  --danger-dim: rgba(248,113,113,.12);
  --info: #38bdf8;

  /* 文字 */
  --text-bright: #f1f5f9;
  --text-primary: #cbd5e1;
  --text-secondary: #64748b;
  --text-muted: #475569;

  /* 中性 */
  --gray-50: #f8fafc;
  --gray-100: #f1f5f9;
  --gray-200: #e2e8f0;
  --gray-300: #cbd5e1;
  --gray-400: #94a3b8;
  --gray-500: #64748b;
  --gray-600: #475569;
  --gray-700: #334155;
  --gray-800: #1e293b;
  --gray-900: #0f172a;

  /* 布局 */
  --sidebar-width: 220px;
  --top-bar-height: 52px;
  --border-radius: 10px;
  --border-radius-lg: 14px;
  --shadow-card: 0 4px 24px rgba(0,0,0,.35);
  --shadow-glow: 0 0 20px rgba(56,189,248,.08);
  --transition: all .25s ease;
}

/* Reset */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background: var(--bg-deep); color: var(--text-primary); line-height: 1.6; }
a { text-decoration: none; color: var(--primary); }
button { cursor: pointer; border: none; background: none; font: inherit; }
input, select, textarea { font: inherit; }
.hidden { display: none !important; }

/* ========================================
   登录页
   ======================================== */
.login-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #050b1a 0%, #0a1628 40%, #0f1f38 100%);
  padding: 20px;
  position: relative;
  overflow: hidden;
}
.login-page::before {
  content: '';
  position: absolute;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(56,189,248,.06) 0%, transparent 70%);
  top: -200px; right: -200px;
  border-radius: 50%;
}
.login-card {
  background: var(--bg-card);
  border: 1px solid var(--border-glow);
  border-radius: var(--border-radius-lg);
  padding: 40px;
  width: 100%;
  max-width: 420px;
  box-shadow: var(--shadow-card);
  position: relative;
  z-index: 1;
}
.login-logo { text-align: center; margin-bottom: 32px; }
.logo-icon { font-size: 48px; margin-bottom: 12px; }
.login-logo h1 { font-size: 1.5rem; color: var(--text-bright); margin-bottom: 4px; }
.login-subtitle { color: var(--text-secondary); font-size: .85rem; }
.login-hint { text-align: center; color: var(--text-muted); font-size: .8rem; margin-top: 16px; }

/* ========================================
   表单元素（暗色）
   ======================================== */
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; font-size: .88rem; }
.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border-subtle);
  border-radius: 6px;
  font-size: .88rem;
  transition: var(--transition);
  background: var(--bg-dark);
  color: var(--text-primary);
}
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-dim);
}
.form-group textarea { resize: vertical; min-height: 80px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }

/* ========================================
   按钮
   ======================================== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: 6px;
  font-size: .88rem;
  font-weight: 500;
  transition: var(--transition);
  white-space: nowrap;
}
.btn-primary { background: var(--primary); color: var(--bg-deep); font-weight: 600; }
.btn-primary:hover { background: #7dd3fc; box-shadow: 0 0 16px var(--primary-glow); }
.btn-success { background: var(--success); color: var(--bg-deep); }
.btn-success:hover { opacity: .9; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { opacity: .9; }
.btn-warning { background: var(--warning); color: var(--bg-deep); }
.btn-outline {
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border-subtle);
}
.btn-outline:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-dim); }
.btn-sm { padding: 5px 10px; font-size: .78rem; }
.btn-block { width: 100%; justify-content: center; padding: 12px; }
.btn-group { display: flex; gap: 8px; flex-wrap: wrap; }

/* ========================================
   布局
   ======================================== */
.app { display: flex; min-height: 100vh; }

/* 侧边栏 */
.sidebar {
  width: var(--sidebar-width);
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border-subtle);
  color: var(--text-primary);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 100;
  transition: var(--transition);
}
.sidebar-header {
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border-subtle);
}
.sidebar-logo { font-size: 24px; }
.sidebar-title { font-size: .95rem; font-weight: 600; color: var(--text-bright); white-space: nowrap; }
.sidebar-nav { flex: 1; padding: 10px 8px; overflow-y: auto; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: 8px;
  color: var(--text-secondary);
  transition: var(--transition);
  margin-bottom: 2px;
  font-size: .88rem;
}
.nav-item:hover { background: var(--primary-dim); color: var(--text-bright); }
.nav-item.active { background: linear-gradient(135deg, rgba(56,189,248,.18), rgba(59,130,246,.12)); color: var(--primary); border: 1px solid var(--border-glow); }
.nav-icon { font-size: 1.05rem; min-width: 22px; text-align: center; }
.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border-subtle);
}
.user-info { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.user-avatar {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--accent-indigo));
  display: flex; align-items: center; justify-content: center;
  font-size: .82rem; font-weight: 600; color: var(--bg-deep);
}
.user-name { font-size: .82rem; font-weight: 500; color: var(--text-bright); }
.user-role { font-size: .72rem; color: var(--text-muted); }
.btn-logout {
  width: 100%;
  padding: 7px;
  color: var(--text-muted);
  font-size: .78rem;
  border-radius: 6px;
  transition: var(--transition);
}
.btn-logout:hover { background: var(--danger-dim); color: var(--danger); }

/* 主内容 */
.main-content {
  flex: 1;
  margin-left: var(--sidebar-width);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  transition: var(--transition);
}
.top-bar {
  height: var(--top-bar-height);
  background: var(--bg-dark);
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 50;
}
.btn-toggle-sidebar { font-size: 1.2rem; color: var(--text-secondary); display: none; }
.page-title { font-size: 1.05rem; font-weight: 600; color: var(--text-bright); }
.top-bar-actions { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.current-time { color: var(--text-muted); font-size: .82rem; }
.content-area { flex: 1; padding: 20px; overflow-y: auto; }

/* ========================================
   卡片（暗色玻璃风）
   ======================================== */
.card {
  background: var(--bg-card);
  border-radius: var(--border-radius);
  border: 1px solid var(--border-subtle);
  box-shadow: var(--shadow-card);
}
.card-header {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.card-header h3 { font-size: .95rem; font-weight: 600; color: var(--text-bright); }
.card-body { padding: 18px; }

/* 统计卡片网格 */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 14px;
  margin-bottom: 20px;
}
.stat-card {
  background: var(--bg-card);
  border-radius: var(--border-radius);
  padding: 18px;
  border: 1px solid var(--border-subtle);
  display: flex;
  align-items: flex-start;
  gap: 14px;
  transition: var(--transition);
}
.stat-card:hover { border-color: var(--border-glow); box-shadow: var(--shadow-glow); transform: translateY(-2px); }
.stat-icon {
  width: 46px; height: 46px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.4rem;
  flex-shrink: 0;
}
.stat-icon.blue { background: var(--primary-dim); }
.stat-icon.green { background: var(--success-dim); }
.stat-icon.orange { background: var(--warning-dim); }
.stat-icon.red { background: var(--danger-dim); }
.stat-icon.cyan { background: rgba(34,211,238,.12); }
.stat-value { font-size: 1.5rem; font-weight: 700; color: var(--text-bright); }
.stat-label { font-size: .82rem; color: var(--text-secondary); margin-top: 2px; }
.stat-change { font-size: .78rem; margin-top: 4px; }
.stat-change.up { color: var(--success); }
.stat-change.down { color: var(--danger); }

/* ========================================
   表格（暗色）
   ======================================== */
.table-wrapper { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
thead { background: rgba(56,189,248,.04); }
th {
  padding: 11px 14px;
  text-align: left;
  font-weight: 600;
  color: var(--text-secondary);
  font-size: .82rem;
  white-space: nowrap;
  border-bottom: 1px solid var(--border-subtle);
}
td {
  padding: 11px 14px;
  border-bottom: 1px solid rgba(148,163,184,.05);
  font-size: .88rem;
  color: var(--text-primary);
}
tr:hover td { background: rgba(56,189,248,.03); }

/* ========================================
   标签 / Badge
   ======================================== */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 9px;
  border-radius: 100px;
  font-size: .76rem;
  font-weight: 500;
  white-space: nowrap;
}
.badge-blue { background: var(--primary-dim); color: var(--primary); }
.badge-green { background: var(--success-dim); color: var(--success); }
.badge-orange { background: var(--warning-dim); color: var(--warning); }
.badge-red { background: var(--danger-dim); color: var(--danger); }
.badge-gray { background: rgba(148,163,184,.1); color: var(--text-secondary); }
.badge-cyan { background: rgba(34,211,238,.12); color: var(--accent-cyan); }

.status-active { background: var(--success-dim); color: var(--success); }
.status-partial { background: var(--warning-dim); color: var(--warning); }
.status-exited { background: rgba(148,163,184,.1); color: var(--text-secondary); }
.status-warning { background: var(--danger-dim); color: var(--danger); }

.risk-high { background: var(--danger-dim); color: var(--danger); }
.risk-medium { background: var(--warning-dim); color: var(--warning); }
.risk-low { background: var(--success-dim); color: var(--success); }

/* ========================================
   模态框（暗色）
   ======================================== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(5,11,26,.85);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
}
.modal {
  background: var(--bg-card);
  border: 1px solid var(--border-glow);
  border-radius: var(--border-radius-lg);
  width: 100%;
  max-width: 640px;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}
.modal-header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-header h3 { font-size: 1.05rem; font-weight: 600; color: var(--text-bright); }
.modal-close {
  font-size: 1.4rem;
  color: var(--text-muted);
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 6px;
}
.modal-close:hover { background: var(--danger-dim); color: var(--danger); }
.modal-body { padding: 20px; overflow-y: auto; flex: 1; }
.modal-footer {
  padding: 14px 20px;
  border-top: 1px solid var(--border-subtle);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

/* ========================================
   工具栏
   ======================================== */
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 12px;
}
.toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 8px; }
.search-box { position: relative; }
.search-box input {
  padding: 8px 12px 8px 34px;
  border: 1px solid var(--border-subtle);
  border-radius: 6px;
  font-size: .84rem;
  width: 240px;
  transition: var(--transition);
  background: var(--bg-dark);
  color: var(--text-primary);
}
.search-box input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-dim); }
.search-box::before { content: "🔍"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: .82rem; }
.filter-select {
  padding: 8px 12px;
  border: 1px solid var(--border-subtle);
  border-radius: 6px;
  font-size: .84rem;
  background: var(--bg-dark);
  color: var(--text-primary);
}

/* ========================================
   图表区域
   ======================================== */
.charts-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 16px;
}
.chart-container {
  position: relative;
  height: 260px;
}

/* ========================================
   风险预警 / 待办列表
   ======================================== */
.risk-alert-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border-subtle);
}
.risk-alert-item:last-child { border-bottom: none; }
.risk-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.risk-dot.high { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
.risk-dot.medium { background: var(--warning); box-shadow: 0 0 8px var(--warning); }
.risk-dot.low { background: var(--success); }
.risk-alert-info { flex: 1; }
.risk-alert-title { font-weight: 500; color: var(--text-bright); font-size: .88rem; }
.risk-alert-desc { color: var(--text-muted); font-size: .78rem; margin-top: 2px; }
.risk-alert-time { color: var(--text-muted); font-size: .76rem; white-space: nowrap; }

/* 健康度评分 */
.health-score {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 42px; height: 42px;
  border-radius: 50%;
  font-weight: 700;
  font-size: .88rem;
}
.health-excellent { background: var(--success-dim); color: var(--success); border: 1px solid rgba(52,211,153,.2); }
.health-good { background: rgba(56,189,248,.12); color: var(--primary); border: 1px solid rgba(56,189,248,.2); }
.health-warning { background: var(--warning-dim); color: var(--warning); border: 1px solid rgba(251,191,36,.2); }
.health-danger { background: var(--danger-dim); color: var(--danger); border: 1px solid rgba(248,113,113,.2); }

/* ========================================
   Toast
   ======================================== */
.toast-container {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.toast {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  color: var(--text-bright);
  padding: 12px 18px;
  border-radius: 8px;
  font-size: .88rem;
  box-shadow: var(--shadow-card);
  animation: toastIn .3s ease;
  max-width: 340px;
}
.toast.success { border-left: 3px solid var(--success); }
.toast.error { border-left: 3px solid var(--danger); }
.toast.warning { border-left: 3px solid var(--warning); }
@keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }

/* 空状态 */
.empty-state { text-align: center; padding: 50px 20px; color: var(--text-muted); }
.empty-state-icon { font-size: 2.8rem; margin-bottom: 10px; }
.empty-state-text { font-size: .92rem; }

/* 文件上传 */
.file-upload-area {
  border: 2px dashed var(--border-subtle);
  border-radius: 8px;
  padding: 20px;
  text-align: center;
  cursor: pointer;
  transition: var(--transition);
  color: var(--text-muted);
}
.file-upload-area:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-dim); }
.file-upload-area input[type="file"] { display: none; }
.file-list { margin-top: 10px; }
.file-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  background: var(--bg-dark);
  border-radius: 6px;
  margin-bottom: 5px;
  font-size: .82rem;
}
.file-item .file-name { flex: 1; }
.file-item .file-size { color: var(--text-muted); }

/* ========================================
   响应式
   ======================================== */

/* ========================================
   投后智驾舱 - Dashboard 专用样式
   ======================================== */

/* Hero 区域 */
.dash-hero {
  position: relative;
  border-radius: 14px;
  overflow: hidden;
  margin-bottom: 20px;
  padding: 28px 32px;
  background: linear-gradient(135deg, #0a1628 0%, #0f2847 40%, #162d50 70%, #0a1628 100%);
  border: 1px solid rgba(56,189,248,.12);
}
.dash-hero-bg {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 600px 300px at 80% 20%, rgba(56,189,248,.08), transparent),
    radial-gradient(ellipse 400px 200px at 20% 80%, rgba(129,140,248,.06), transparent);
  pointer-events: none;
}
.dash-hero-content {
  position: relative;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
}
.dash-hero-title {
  font-size: 1.6rem;
  font-weight: 700;
  color: #f1f5f9;
  letter-spacing: .5px;
  text-shadow: 0 0 30px rgba(56,189,248,.2);
}
.dash-hero-sub {
  color: rgba(148,163,184,.7);
  font-size: .85rem;
  margin-top: 4px;
}
.dash-hero-meta { text-align: right; }
.dash-hero-time { color: rgba(148,163,184,.6); font-size: .82rem; }
.dash-hero-stats { color: rgba(148,163,184,.5); font-size: .78rem; margin-top: 4px; }
.dash-divider { margin: 0 8px; opacity: .3; }

/* KPI 卡片网格 */
.dash-kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  margin-bottom: 20px;
}
.dash-kpi-card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  padding: 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  transition: var(--transition);
  cursor: default;
}
.dash-kpi-card:hover {
  border-color: var(--border-glow);
  box-shadow: 0 4px 20px var(--glow, rgba(56,189,248,.1));
  transform: translateY(-2px);
}
.dash-kpi-icon {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  flex-shrink: 0;
}
.dash-kpi-body { flex: 1; min-width: 0; }
.dash-kpi-value {
  font-size: 1.4rem;

.dash-chart-card {

.dash-chart-card:hover {
  border-color: var(--border-glow);

.dash-chart-header {
  padding: 14px 18px;

  justify-content: space-between;
  background: rgba(56,189,248,.02);
}
.dash-chart-header h3 {
  font-size: .92rem;
  font-weight: 600;
  color: var(--text-bright);
}
.dash-chart-body {
  padding: 16px;
}

/* 滚动区域 */

  max-height: 280px;
  overflow: hidden;
  position: relative;
}
.dash-scroll-inner {
  padding: 10px 18px;

  display: flex;

.dash-risk-desc { color: var(--text-muted); font-size: .78rem; margin-top: 3px; line-height: 1.5; }

/* 待办条目 */

  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border-subtle);

.dash-todo-item:last-child { border-bottom: none; }

/* 暗色 checkbox */

@media (max-width: 1024px) {

      const raw = localStorage.getItem(this._prefix + key);
      return raw ? JSON.parse(raw) : null;

  },

  _set(key, val) {
    localStorage.setItem(this._prefix + key, JSON.stringify(val));

    const list = this.getProjects();

    p.createdAt = p.createdAt || new Date().toISOString();
    list.push(p);
    this.saveProjects(list);
    return p;
  },
  updateProject(id, data) {
    const list = this.getProjects();
    const idx = list.findIndex(p => p.id === id);
    if (idx >= 0) { Object.assign(list[idx], data); this.saveProjects(list); return list[idx]; }
    return null;

  deleteProject(id) {

/* === cloud.js === */
/* ========================================
   云端数据同步模块（GitHub Gist）
   ─────────────────────────────────────
   原理：将全部数据存为一个 JSON 文件，
   保存在 GitHub Gist（私有）中。
   换设备登录后自动拉取云端数据。
   ======================================== */

const CloudStore = {
  // ===== 配置区 =====
  // 📌 部署前请替换为你的 GitHub Token 和 Gist ID
  //    Token 只需要 gist 权限（最小化）
  //    Gist ID 在首次保存时自动创建并显示在页面上
  token: '***', // 🔴 替换为你的 GitHub Token
  gistId: '',    // 🔴 首次保存后自动创建，把生成的 ID 填回来永久绑定
  fileName: 'post-investment-data.json',

  // ===== 清理非ASCII字符（防止 fetch 报错） =====
  sanitize(str) {
    return (str || '').replace(/[^\x00-\x7F]/g, '');
  },

  // ===== 获取云端数据 =====
  async fetch() {
    if (!this.gistId) return null;
    try {
      const resp = await fetch(`https://api.github.com/gists/${this.gistId}`, {
        headers: { 'Authorization': `token ${this.sanitize(this.token)}`, 'Accept': 'application/vnd.github.v3+json' }
      });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const gist = await resp.json();
      const file = gist.files[this.fileName];
      if (!file) return null;
      return JSON.parse(file.content);
    } catch (e) {
      console.error('云端拉取失败:', e);
      return null;
    }
  },

  // ===== 保存到云端 =====
  async save(data) {
    const jsonStr = JSON.stringify(data, null, 2);
    const body = {
      description: '投后管理系统数据备份',
      public: false, // 私有 Gist，不公开
      files: {
        [this.fileName]: { content: jsonStr }
      }
    };

    try {
      let resp;
      if (this.gistId) {
        // 更新已有 Gist
        resp = await fetch(`https://api.github.com/gists/${this.gistId}`, {
          method: 'PATCH',
          headers: { 'Authorization': `token ${this.sanitize(this.token)}`, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' },
          body: JSON.stringify(body)
        });
      } else {
        // 首次创建 Gist
        resp = await fetch('https://api.github.com/gists', {
          method: 'POST',
          headers: { 'Authorization': `token ${this.sanitize(this.token)}`, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' },
          body: JSON.stringify(body)
        });
        if (resp.ok) {
          const gist = await resp.json();
          this.gistId = gist.id;
          localStorage.setItem('gist_id', gist.id);
          console.log('✅ Gist 已创建，ID:', gist.id);
          // 弹窗提醒用户保存 Gist ID
          openModal('🎉 云端存储已初始化', `
            <div style="text-align:center;padding:10px;">
              <p style="font-size:1rem;margin-bottom:12px;">Gist 已创建成功！</p>
              <p style="color:var(--text-secondary);font-size:.85rem;margin-bottom:8px;">请复制以下 Gist ID 保存到配置中：</p>
              <div style="background:var(--bg-dark);padding:12px;border-radius:8px;font-family:monospace;font-size:1.1rem;color:var(--primary);word-break:break-all;user-select:all;">${gist.id}</div>
              <p style="color:var(--text-muted);font-size:.78rem;margin-top:8px;">此 ID 绑定后换设备也能同步数据</p>
            </div>
          `, `
            <button class="btn btn-primary" onclick="copyGistId('${gist.id}')">📋 复制 Gist ID</button>
            <button class="btn btn-outline" onclick="closeModal()">关闭</button>
          `);
          // 同时自动填入配置框
          const gistInput = document.getElementById('cloud_gist');
          if (gistInput) gistInput.value = gist.id;
        }
      }
      return resp.ok;
    } catch (e) {
      console.error('云端保存失败:', e);
      return false;
    }
  },

  // ===== 测试连接 =====
  async test() {
    try {
      const resp = await fetch('https://api.github.com/user', {
        headers: { 'Authorization': `token ${this.sanitize(this.token)}`, 'Accept': 'application/vnd.github.v3+json' }
      });
      if (resp.ok) {
        const user = await resp.json();
        return { ok: true, user: user.login };
      }
      return { ok: false, error: 'Token 无效' };
    } catch (e) {
      return { ok: false, error: e.message };
    }
  },

  // ===== 恢复 Gist ID =====
  init() {
    const saved = localStorage.getItem('gist_id');
    if (saved && !this.gistId) this.gistId = saved;
  }
};

/* ========================================
   权限管理模块
   ======================================== */
const Auth = {
  currentUser: null,

  ROLE_LABELS: {
    admin: '管理员',
    specialist: '投后专员',
    viewer: '普通人员'
  },

  login(username, role) {
    this.currentUser = { username, role };
    localStorage.setItem('pims_session', JSON.stringify(this.currentUser));
    return this.currentUser;
  },

  logout() {
    this.currentUser = null;
    localStorage.removeItem('pims_session');
  },

  restore() {
    try {
      const s = localStorage.getItem('pims_session');
      if (s) { this.currentUser = JSON.parse(s); return true; }
    } catch {}
    return false;
  },

  canEdit() {
    return this.currentUser && (this.currentUser.role === 'admin' || this.currentUser.role === 'specialist');
  },

  canDelete() {
    return this.currentUser && this.currentUser.role === 'admin';
  },

  canManageUsers() {
    return this.currentUser && this.currentUser.role === 'admin';
  },

  getRoleLabel() {
    return this.ROLE_LABELS[this.currentUser?.role] || '未知';
  }
};

}

// Excel 导出
function exportToExcel(data, columns, filename) {
  const wsData = [columns.map(c => c.label)];
  data.forEach(row => {
    wsData.push(columns.map(c => {
      let val = row[c.key];
      if (c.formatter) val = c.formatter(val, row);
      return val ?? '【待人工补充】';
    }));
  });
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  // 设置列宽
  ws['!cols'] = columns.map(c => ({ wch: c.width || 15 }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
  XLSX.writeFile(wb, filename + '.xlsx');
  showToast('导出成功：' + filename + '.xlsx');
}

// 计算健康度评分（0-100）
function calcHealthScore(projectId) {
  const quarterly = Store.getQuarterly().filter(q => q.projectId === projectId);
  const risks = Store.getRisks().filter(r => r.projectId === projectId);
  const project = Store.getProjects().find(p => p.id === projectId);

  let score = 70; // 基准分

  // 财务维度 (40分)
  if (quarterly.length > 0) {
    const latest = quarterly.sort((a, b) => b.quarter.localeCompare(a.quarter))[0];
    if (latest.netProfit > 0) score += 10;
    else score -= 10;
    if (latest.revenue > 0) score += 5;
    if (latest.cashFlow > 0) score += 5;
    if (latest.grossMargin > 40) score += 5;
    else if (latest.grossMargin < 20) score -= 5;
    if (latest.revenue > 2000) score += 5;
  } else {
    score -= 10; // 无数据扣分
  }

  // 风险维度 (30分)
  const highRisks = risks.filter(r => r.level === 'high').length;
  const medRisks = risks.filter(r => r.level === 'medium').length;
  score -= highRisks * 15;
  score -= medRisks * 5;

  // 项目状态
  if (project?.status === 'warning') score -= 15;

  return Math.max(0, Math.min(100, Math.round(score)));
}

// 健康度等级
function getHealthLevel(score) {
  if (score >= 80) return { label: '优秀', class: 'health-excellent' };
  if (score >= 60) return { label: '良好', class: 'health-good' };
  if (score >= 40) return { label: '关注', class: 'health-warning' };
  return { label: '预警', class: 'health-danger' };
}

// 绑定文件上传预览
function bindFileUpload(inputId, listId) {
  const input = document.getElementById(inputId);
  const list = document.getElementById(listId);
  if (!input || !list) return;
  input.addEventListener('change', () => {
    list.innerHTML = '';
    Array.from(input.files).forEach(f => {
      const div = document.createElement('div');
      div.className = 'file-item';
      div.innerHTML = `<span class="file-name">📎 ${f.name}</span><span class="file-size">${(f.size/1024).toFixed(1)}KB</span>`;
      list.appendChild(div);
    });
  });
}

  return `

      <div class="dash-kpi-icon" style="background:${glowColor}15;color:${glowColor};">${icon}</div>
      <div class="dash-kpi-body">

        <div class="dash-kpi-label">${label}</div>

    </div>`;
}

/* ========== 滚动效果 ========== */
function startScrolling() {
  const riskBox = document.getElementById('riskScrollBox');
  const riskInner = document.getElementById('riskScrollInner');
  if (riskBox && riskInner && riskInner.scrollHeight > riskBox.clientHeight) {
    let rPos = 0;
    dashScrollTimer1 = setInterval(() => {
      rPos += 1;
      if (rPos >= riskInner.scrollHeight - riskBox.clientHeight) rPos = 0;
      riskBox.scrollTop = rPos;
    }, 60);
    riskBox.addEventListener('mouseenter', () => { if (dashScrollTimer1) { clearInterval(dashScrollTimer1); dashScrollTimer1 = null; } });
    riskBox.addEventListener('mouseleave', () => {
      dashScrollTimer1 = setInterval(() => { rPos += 1; if (rPos >= riskInner.scrollHeight - riskBox.clientHeight) rPos = 0; riskBox.scrollTop = rPos; }, 60);
    });
  }

  const todoBox = document.getElementById('todoScrollBox');
  const todoInner = document.getElementById('todoScrollInner');
  if (todoBox && todoInner && todoInner.scrollHeight > todoBox.clientHeight) {
    let tPos = 0;
    dashScrollTimer2 = setInterval(() => {
      tPos += 1;
      if (tPos >= todoInner.scrollHeight - todoBox.clientHeight) tPos = 0;
      todoBox.scrollTop = tPos;
    }, 70);
    todoBox.addEventListener('mouseenter', () => { if (dashScrollTimer2) { clearInterval(dashScrollTimer2); dashScrollTimer2 = null; } });
    todoBox.addEventListener('mouseleave', () => {
      dashScrollTimer2 = setInterval(() => { tPos += 1; if (tPos >= todoInner.scrollHeight - todoBox.clientHeight) tPos = 0; todoBox.scrollTop = tPos; }, 70);
    });
  }
}

                // 预算偏离标记

                const revChange = prevQ && prevQ.revenue ? ((q.revenue - prevQ.revenue) / prevQ.revenue * 100).toFixed(1) : null;

                    <td>
                      ${fmtAmount(q.revenue)}
                      ${revChange !== null ? `<br><span style="font-size:.75rem;color:${Number(revChange)>=0?'var(--success)':'var(--danger)'}">${Number(revChange)>=0?'+':''}${revChange}%</span>` : ''}
                    </td>
                    <td ${profitFlag}>${fmtAmount(q.netProfit)}</td>
                    <td ${q.cashFlow < 0 ? 'style="color:var(--danger)"' : ''}>${fmtAmount(q.cashFlow)}</td>
                    <td>${fmtPct(q.grossMargin)}</td>
                    <td style="max-width:200px;white-space:pre-wrap;font-size:.82rem;">${q.notes || '【待人工补充】'}</td>
                    <td>${q.attachments ? q.attachments.map(a => `📎 ${a}`).join('<br>') : '<span style="color:var(--gray-400)">未上传</span>'}</td>

      <div class="card-body">
        <div class="chart-container"><canvas id="chartQuarterly"></canvas></div>
      </div>
    </div>
    ` : ''}
  `;

  document.getElementById('contentArea').innerHTML = html;

  // 渲染趋势图
  if (data.length > 0) {
    setTimeout(() => renderQuarterlyChart(data), 100);
  }
}

function renderQuarterlyChart(data) {
  const ctx = document.getElementById('chartQuarterly');
  if (!ctx) return;

  const grouped = {};
  data.forEach(q => {
    if (!grouped[q.projectId]) grouped[q.projectId] = [];
    grouped[q.projectId].push(q);
  });

  const colors = ['#1a56db','#059669','#d97706','#dc2626','#0891b2','#7c3aed'];
  const datasets = [];
  Object.entries(grouped).forEach(([pid, qs], i) => {
    const sorted = qs.sort((a,b) => a.quarter.localeCompare(b.quarter));
    datasets.push({
      label: getProjectName(pid) + ' 营收',
      data: sorted.map(q => q.revenue),
      borderColor: colors[i % colors.length],
      backgroundColor: colors[i % colors.length] + '20',
      tension: 0.3,
      fill: false
    });
  });

  const allQuarters = [...new Set(data.map(q => q.quarter))].sort();

  new Chart(ctx, {
    type: 'line',
    data: { labels: allQuarters, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { position: 'top' } },
      scales: { y: { beginAtZero: true, title: { display: true, text: '万元' } } }
    }
  });
}

// ===== 云端配置函数 =====
function saveCloudConfig() {
  // 清理 Token 中的非 ASCII 字符（防止 fetch 报错）
  let token = document.getElementById('cloud_token').value.trim();
  token = token.replace(/[^\x00-\x7F]/g, ''); // 移除非 ASCII 字符
  let gistId = document.getElementById('cloud_gist').value.trim();
  gistId = gistId.replace(/[^\x00-\x7F]/g, '');
  
  if (!token) { showToast('请输入 GitHub Token', 'warning'); return; }
  if (!token.startsWith('ghp_') && !token.startsWith('github_pat_')) {
    showToast('Token 格式不正确，应以 ghp_ 开头', 'warning');
    return;
  }
  
  CloudStore.token = token;
  CloudStore.gistId = gistId;
  localStorage.setItem('gist_id', gistId);
  showToast('云端配置已保存（Token 长度: ' + token.length + '）');
}

async function testCloudConn() {
  const el = document.getElementById('cloudStatus');
  el.innerHTML = '<span style="color:var(--text-muted);">测试中...</span>';
  const result = await CloudStore.test();
  if (result.ok) {
    el.innerHTML = '<span style="color:var(--success);">✅ 连接成功！GitHub 用户: ' + result.user + '</span>';
  } else {
    el.innerHTML = '<span style="color:var(--danger);">❌ 连接失败: ' + result.error + '</span>';
  }
}

}

let irProjectFilter = '';

function renderInvestReturns() {
  const allReturns = Store.getInvestReturns();
  const projects = Store.getProjects();
  const data = allReturns.filter(r => !irProjectFilter || r.projectId === irProjectFilter)
    .sort((a,b) => b.period.localeCompare(a.period));

  const canEdit = Auth.canEdit();
  const canDelete = Auth.canDelete();

  // 汇总统计
  const totalInvest = projects.reduce((s, p) => s + (Number(p.amount) || 0), 0);
  const totalReturn = allReturns.reduce((s, r) => s + (Number(r.cumulativeReturn) || 0), 0);
  const moic = totalInvest > 0 ? ((totalInvest + totalReturn) / totalInvest).toFixed(2) : '【待补充】';

  // 按项目汇总最新收益
  const projectReturns = {};
  allReturns.forEach(r => {
    if (!projectReturns[r.projectId] || r.period > projectReturns[r.projectId].period) {
      projectReturns[r.projectId] = r;
    }
  });

  const html = `
    <!-- 统计卡片 -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon green">💰</div>

      </div>
      <div class="stat-card">
        <div class="stat-icon blue">📊</div>
        <div><div class="stat-value">${moic}</div><div class="stat-label">MOIC（投入资本倍数）</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon cyan">📈</div>
        <div><div class="stat-value">${totalInvest > 0 ? (totalReturn / totalInvest * 100).toFixed(1) + '%' : '【待补充】'}</div><div class="stat-label">整体收益率</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon orange">📋</div>
        <div><div class="stat-value">${allReturns.length}</div><div class="stat-label">收益记录数</div></div>
      </div>
    </div>

    <div class="toolbar">
      <div class="toolbar-left">
        <select class="filter-select" onchange="irProjectFilter=this.value;renderInvestReturns()">
          <option value="">全部项目</option>
          ${projects.map(p => `<option value="${p.id}" ${irProjectFilter===p.id?'selected':''}>${p.name}</option>`).join('')}
        </select>
      </div>
      <div class="toolbar-right">
        ${canEdit ? '<button class="btn btn-primary" onclick="showInvestReturnForm()">＋ 新增收益记录</button>' : ''}
        <button class="btn btn-outline" onclick="exportInvestReturns()">📥 导出Excel</button>
      </div>
    </div>

    <!-- 按项目汇总表 -->
    <div class="card" style="margin-bottom:16px;">
      <div class="card-header"><h3>📊 各项目投资收益汇总</h3></div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr><th>项目名称</th><th>投资金额(万)</th><th>会计核算方法</th><th>最新公允价值(万)</th><th>累计收益(万)</th><th>收益率</th><th>MOIC</th></tr>
          </thead>
          <tbody>
            ${projects.map(p => {
              const ret = projectReturns[p.id];
              const cumRet = ret ? ret.cumulativeReturn : null;
              const retRate = ret ? ret.returnRate : null;
              const pMoic = p.amount > 0 && cumRet !== null ? ((p.amount + cumRet) / p.amount).toFixed(2) : null;
              return `<tr>
                <td><strong>${p.name}</strong></td>
                <td>${fmtAmount(p.amount)}</td>
                <td style="font-size:.8rem;">${p.accountingMethod || '【待补充】'}</td>

                <td ${retRate !== null && retRate < 0 ? 'style="color:var(--danger)"' : ''}>${retRate !== null ? retRate + '%' : '【待补充】'}</td>
                <td>${pMoic || '【待补充】'}</td>

            }).join('')}

        </table>
      </div>
    </div>

    <!-- 收益明细 -->
    <div class="card">
      <div class="card-header"><h3>📋 收益明细记录</h3></div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr><th>项目</th><th>期间</th><th>核算方法</th><th>收盘价</th><th>公允价值(万)</th><th>当期收益(万)</th><th>累计收益(万)</th><th>收益率</th><th>备注</th>${canEdit||canDelete?'<th>操作</th>':''}</tr>
          </thead>
          <tbody>
            ${data.length === 0 ? '<tr><td colspan="10" style="text-align:center;color:var(--gray-400);padding:30px;">暂无收益记录</td></tr>' :
            data.map(r => `<tr>
              <td><strong>${getProjectName(r.projectId)}</strong></td>
              <td><span class="badge badge-blue">${r.period}</span></td>
              <td style="font-size:.78rem;">${r.method || '【待补充】'}</td>
              <td>${r.closingPrice ? '¥' + r.closingPrice : '-'}</td>
              <td>${fmtAmount(r.fairValue)}</td>
              <td ${r.currentReturn < 0 ? 'style="color:var(--danger)"' : ''}>${fmtAmount(r.currentReturn)}</td>
              <td ${r.cumulativeReturn < 0 ? 'style="color:var(--danger)"' : ''}>${fmtAmount(r.cumulativeReturn)}</td>
              <td ${r.returnRate < 0 ? 'style="color:var(--danger)"' : ''}>${r.returnRate ? r.returnRate + '%' : '【待补充】'}</td>
              <td style="font-size:.82rem;max-width:150px;">${r.notes || ''}</td>
              ${canEdit||canDelete?`<td><div class="btn-group">
                ${canEdit?`<button class="btn btn-sm btn-outline" onclick="showInvestReturnForm('${r.id}')">编辑</button>`:''}
                ${canDelete?`<button class="btn btn-sm btn-danger" onclick="deleteInvestReturnConfirm('${r.id}')">删除</button>`:''}
              </div></td>`:''}
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  document.getElementById('contentArea').innerHTML = html;
}

function showInvestReturnForm(rid) {
  if (!editGuard()) return;

  openModal(r ? '编辑收益记录' : '新增收益记录', `
    <div class="form-row">
      <div class="form-group"><label>项目 *</label>
        <select id="irf_project">${Store.getProjects().map(p => `<option value="${p.id}" ${r?.projectId===p.id?'selected':''}>${p.name}</option>`).join('')}</select>
      </div>
      <div class="form-group"><label>期间 *</label>
        <select id="irf_period">${getQuarterOptions().map(o => `<option value="${o}" ${r?.period===o?'selected':''}>${o}</option>`).join('')}</select>

      <div class="form-group"><label>二级市场收盘价(元)</label><input type="number" step="0.01" id="irf_price" value="${r?.closingPrice ?? ''}" placeholder="无则留空"></div>

      <div class="form-group"><label>备注</label><input type="text" id="irf_notes" value="${r?.notes || ''}"></div>
    </div>
  `, `
    <button class="btn btn-outline" onclick="closeModal()">取消</button>
    <button class="btn btn-primary" onclick="saveInvestReturn('${rid||''}')">保存</button>
  `);
}

function saveInvestReturn(rid) {
  const data = {
    projectId: document.getElementById('irf_project').value,
    period: document.getElementById('irf_period').value,
    method: document.getElementById('irf_method').value,
    closingPrice: Number(document.getElementById('irf_price').value) || null,
    fairValue: Number(document.getElementById('irf_fv').value) || null,
    currentReturn: Number(document.getElementById('irf_cur').value) || null,
    cumulativeReturn: Number(document.getElementById('irf_cum').value) || null,
    returnRate: Number(document.getElementById('irf_rate').value) || null,
    notes: document.getElementById('irf_notes').value.trim()
  };
  if (!data.projectId || !data.fairValue) { showToast('请填写项目和公允价值', 'error'); return; }
  if (rid) { Store.updateInvestReturn(rid, data); showToast('更新成功'); }
  else { Store.addInvestReturn(data); showToast('新增成功'); }
  closeModal(); renderInvestReturns();
}

function deleteInvestReturnConfirm(rid) {
  if (!deleteGuard()) return;
  openModal('确认删除', '<p>确定删除此收益记录？</p>',
    `<button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-danger" onclick="Store.deleteInvestReturn('${rid}');closeModal();showToast('已删除');renderInvestReturns()">确认</button>`);
}

function exportInvestReturns() {
  const data = Store.getInvestReturns().sort((a,b) => b.period.localeCompare(a.period));
  exportToExcel(data, [
    { key: 'projectId', label: '项目', width: 15, formatter: v => getProjectName(v) },
    { key: 'period', label: '期间', width: 10 },
    { key: 'method', label: '核算方法', width: 20, formatter: v => v || '【待补充】' },
    { key: 'closingPrice', label: '收盘价(元)', width: 10, formatter: v => v ?? '-' },

    { key: 'currentReturn', label: '当期收益(万元)', width: 14, formatter: v => v ?? '【待补充】' },
    { key: 'cumulativeReturn', label: '累计收益(万元)', width: 14, formatter: v => v ?? '【待补充】' },
    { key: 'returnRate', label: '收益率(%)', width: 12, formatter: v => v ?? '【待补充】' },

}

let reportProjectId = '';
let reportPeriod = '';

// 报告专用数据存储（补充字段，不属于其他模块的数据）
const ReportStore = {
  _key: 'pims_reportData',
  getAll() {
    try { return JSON.parse(localStorage.getItem(this._key)) || {}; } catch { return {}; }
  },
  get(projectId, period) {
    const all = this.getAll();
    return all[`${projectId}_${period}`] || {};
  },
  save(projectId, period, data) {
    const all = this.getAll();
    all[`${projectId}_${period}`] = { ...all[`${projectId}_${period}`], ...data, updatedAt: new Date().toISOString() };
    localStorage.setItem(this._key, JSON.stringify(all));
  }
};

          <h3 style="font-size:.95rem;">${sec.title}</h3>
          ${sec.auto ? '<span class="badge badge-green" style="font-size:.7rem;">已有数据</span>' : ''}
        </div>
        <span id="toggleIcon_${sec.key}" style="color:var(--text-muted);transition:transform .2s;">▼</span>
      </div>
      <div id="secBody_${sec.key}" class="card-body" style="display:none;">
        ${sec.auto ? `
          <div style="margin-bottom:16px;padding:12px;background:rgba(56,189,248,.04);border-radius:8px;border:1px solid var(--border-subtle);">
            <div style="font-size:.78rem;color:var(--primary);margin-bottom:8px;font-weight:600;">📊 系统已自动提取的数据</div>
            ${sec.auto}
          </div>
        ` : ''}
        ${canEdit ? `
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            ${sec.fields.map(f => renderField(f, rd, pid, period)).join('')}
          </div>
          <div style="margin-top:12px;text-align:right;">
            <button class="btn btn-sm btn-primary" onclick="saveReportSection('${sec.key}','${pid}','${period}')">💾 保存本节</button>
          </div>
        ` : '<div style="color:var(--text-muted);font-size:.85rem;">无编辑权限</div>'}
      </div>
    </div>
  `;
}

function renderField(f, rd, pid, period) {
  // 对于数字字段，优先从已有模块取值
  let val = rd[f.key] ?? f.defaultVal ?? '';
  if (val === null || val === undefined) val = '';

  const isFullWidth = f.type === 'textarea';

  if (f.type === 'textarea') {
    return `<div class="form-group" style="margin-bottom:8px;grid-column:span 2;">
      <label style="font-size:.82rem;">${f.label}</label>
      <textarea id="rpt_${f.key}" rows="${f.rows||3}" placeholder="${f.placeholder||''}" style="font-size:.85rem;">${val}</textarea>
    </div>`;
  }
  return `<div class="form-group" style="margin-bottom:8px;">
    <label style="font-size:.82rem;">${f.label}</label>
    <input type="${f.type}" id="rpt_${f.key}" value="${val}" placeholder="${f.placeholder||''}" style="font-size:.85rem;">
  </div>`;
}

function toggleReportSection(key) {
  const body = document.getElementById(`secBody_${key}`);
  const icon = document.getElementById(`toggleIcon_${key}`);
  if (body.style.display === 'none') {
    body.style.display = 'block';
    icon.style.transform = 'rotate(180deg)';
  } else {
    body.style.display = 'none';
    icon.style.transform = 'rotate(0)';
  }
}

function saveReportSection(secKey, pid, period) {
  const secBody = document.getElementById(`secBody_${secKey}`);
  const inputs = secBody.querySelectorAll('input, textarea');
  const data = {};
  inputs.forEach(el => {
    const key = el.id.replace('rpt_', '');
    data[key] = el.value;
  });
  ReportStore.save(pid, period, data);
  showToast('「' + secKey + '」数据已保存');
}

function renderDetailFinanceChart(pid) {
  const ctx = document.getElementById('chartDetailFinance');
  if (!ctx) return;
  const data = Store.getQuarterly().filter(q => q.projectId === pid).sort((a,b) => a.quarter.localeCompare(b.quarter));
  if (data.length === 0) return;
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: data.map(q => q.quarter),
      datasets: [
        { label: '营收', data: data.map(q => q.revenue), backgroundColor: '#1a56db', borderRadius: 4 },
        { label: '净利润', data: data.map(q => q.netProfit), backgroundColor: data.map(q => q.netProfit >= 0 ? '#059669' : '#dc2626'), borderRadius: 4 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'top' } },
      scales: { y: { beginAtZero: true, title: { display: true, text: '万元' } } }
    }
  });
}

function switchDetailTab(tab, projectId) {
  detailCurrentTab = tab;
  renderProjectDetail(projectId);
}

function renderDetailTab(tab, pid) {
  switch (tab) {
    case 'basic': return renderBasicTab(pid);
    case 'finance': return renderFinanceTab(pid);
    case 'business': return renderBusinessTab(pid);
    case 'risk': return renderRiskTab(pid);
    case 'governance': return renderGovernanceTab(pid);
    case 'interview': return renderInterviewTab(pid);
    case 'docs': return renderDocsTab(pid);
    case 'exit': return renderExitTab(pid);
    default: return '<div class="empty-state">未知Tab</div>';
  }
}

function showQuarterlyFormDetail(pid, qid) {
  if (!editGuard()) return;
  const q = qid ? Store.getQuarterly().find(x => x.id === qid) : null;
  const title = q ? '编辑季度数据' : '新增季度数据';

  openModal(title, `
    <div class="form-row">
      <div class="form-group"><label>季度 *</label>
        <select id="qfd_quarter">${getQuarterOptions().map(o => `<option value="${o}" ${q?.quarter===o?'selected':''}>${o}</option>`).join('')}</select>
      </div>
      <div class="form-group"><label>毛利率(%)</label><input type="number" step="0.1" id="qfd_gm" value="${q?.grossMargin ?? ''}"></div>
    </div>
    <div class="form-row-3">
      <div class="form-group"><label>营收(万元)</label><input type="number" id="qfd_rev" value="${q?.revenue ?? ''}"></div>
      <div class="form-group"><label>净利润(万元)</label><input type="number" id="qfd_np" value="${q?.netProfit ?? ''}"></div>
      <div class="form-group"><label>经营现金流(万元)</label><input type="number" id="qfd_cf" value="${q?.cashFlow ?? ''}"></div>
    </div>
    <div class="form-group"><label>财报附件</label>
      <div class="file-upload-area" onclick="document.getElementById('qfd_file').click()">
        <input type="file" id="qfd_file" multiple accept=".pdf,.xlsx,.xls,.csv">
        <div>📎 点击上传财报文件</div>
      </div>
      <div class="file-list" id="qfd_fileList"></div>
    </div>
    <div class="form-group"><label>访谈纪要</label><textarea id="qfd_notes" rows="3">${q?.notes || ''}</textarea></div>
  `, `
    <button class="btn btn-outline" onclick="closeModal()">取消</button>
    <button class="btn btn-primary" onclick="saveQuarterlyDetail('${pid}','${qid||''}')">保存</button>
  `);
  bindFileUpload('qfd_file', 'qfd_fileList');
}

function saveQuarterlyDetail(pid, qid) {
  const files = document.getElementById('qfd_file')?.files;
  const attachments = files?.length ? Array.from(files).map(f => f.name) : (qid ? Store.getQuarterly().find(x=>x.id===qid)?.attachments : []);
  const data = {
    projectId: pid, quarter: document.getElementById('qfd_quarter').value,
    revenue: Number(document.getElementById('qfd_rev').value) || null,
    netProfit: Number(document.getElementById('qfd_np').value) || null,
    cashFlow: Number(document.getElementById('qfd_cf').value) || null,
    grossMargin: Number(document.getElementById('qfd_gm').value) || null,
    notes: document.getElementById('qfd_notes').value.trim(), attachments
  };
  if (qid) { Store.updateQuarterly(qid, data); showToast('更新成功'); }
  else { Store.addQuarterly(data); showToast('新增成功'); }
  closeModal(); renderProjectDetail(pid);
}

function deleteQuarterlyConfirmDetail(qid, pid) {

/* ========== Tab4: 风险台账 ========== */
function renderRiskTab(pid) {
  const risks = Store.getRisks().filter(r => r.projectId === pid).sort((a,b) => { const o={high:0,medium:1,low:2}; return o[a.level]-o[b.level]; });
  const canEdit = Auth.canEdit();

  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h3 style="font-size:1rem;color:var(--gray-800);">⚠️ 项目风险台账</h3>
      ${canEdit ? `<button class="btn btn-primary btn-sm" onclick="showRiskFormDetail('${pid}')">＋ 新增风险</button>` : ''}
    </div>

            return `<tr style="${rowStyle}">
              <td><span class="badge ${rl.class}">${rl.label}风险</span></td>

              <td style="max-width:200px;white-space:pre-wrap;font-size:.82rem;color:var(--gray-600);">${r.followUp || '【待人工补充】'}</td>
              <td>${fmtDate(r.createdAt)}</td>
              ${canEdit||canDelete?`<td><div class="btn-group">
                ${canEdit?`<button class="btn btn-sm btn-outline" onclick="showRiskFormDetail('${pid}','${r.id}')">编辑</button>`:''}
                ${canDelete?`<button class="btn btn-sm btn-danger" onclick="deleteRiskConfirmDetail('${r.id}','${pid}')">删除</button>`:''}
              </div></td>`:''}
            </tr>`;

function renderDocsTab(pid) {
  const docs = Store.getDocuments().filter(d => d.projectId === pid).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
  const canEdit = Auth.canEdit();
  const canDelete = Auth.canDelete();

  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h3 style="font-size:1rem;color:var(--gray-800);">📁 项目文档库</h3>
      ${canEdit ? `<button class="btn btn-primary btn-sm" onclick="showDocFormDetail('${pid}')">＋ 上传文档</button>` : ''}
    </div>
    ${docs.length === 0 ? '<div class="empty-state"><div class="empty-state-icon">📁</div><div class="empty-state-text">暂无文档</div></div>' :
    Object.entries(grouped).map(([cat, items]) => `
      <div style="margin-bottom:20px;">
        <h4 style="font-size:.9rem;color:var(--gray-600);margin-bottom:10px;">${cat}（${items.length}）</h4>
        <div class="table-wrapper">
          <table>
            <thead><tr><th>文档名称</th><th>文件大小</th><th>上传时间</th><th>操作</th></tr></thead>
            <tbody>
              ${items.map(d => `<tr>
                <td>📄 <strong>${d.name}</strong></td>
                <td>${d.fileSize || '【待补充】'}</td>
                <td>${fmtDate(d.createdAt)}</td>
                <td>
                  <div class="btn-group">
                    <button class="btn btn-sm btn-outline" onclick="showToast('预览功能开发中','warning')">预览</button>
                    <button class="btn btn-sm btn-outline" onclick="showToast('下载功能开发中','warning')">下载</button>
                    ${canDelete ? `<button class="btn btn-sm btn-danger" onclick="deleteDocDetail('${d.id}','${pid}')">删除</button>` : ''}
                  </div>
                </td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `).join('')}
  `;
}

function showDocFormDetail(pid) {
  if (!editGuard()) return;
  openModal('上传文档', `
    <div class="form-row">
      <div class="form-group"><label>文档分类 *</label>
        <select id="dfd_cat">${DOC_CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('')}</select>
      </div>
      <div class="form-group"><label>文档名称 *</label><input type="text" id="dfd_name" placeholder="输入文档名称"></div>
    </div>
    <div class="form-group"><label>上传文件</label>
      <div class="file-upload-area" onclick="document.getElementById('dfd_file').click()">
        <input type="file" id="dfd_file" multiple><div>📎 点击选择文件</div>
      </div>
      <div class="file-list" id="dfd_fileList"></div>
    </div>
  `, `
    <button class="btn btn-outline" onclick="closeModal()">取消</button>
    <button class="btn btn-primary" onclick="saveDocDetail('${pid}')">保存</button>
  `);
  bindFileUpload('dfd_file', 'dfd_fileList');
}

function saveDocDetail(pid) {
  const name = document.getElementById('dfd_name').value.trim();
  const category = document.getElementById('dfd_cat').value;
  const files = document.getElementById('dfd_file')?.files;
  if (!name) { showToast('请填写文档名称', 'error'); return; }
  Store.addDocument({ projectId: pid, name, category, fileSize: files?.length ? (files[0].size/1024/1024).toFixed(1)+'MB' : '【待人工补充】', fileName: files?.[0]?.name });
  closeModal(); showToast('文档上传成功'); renderProjectDetail(pid);
}

function deleteDocDetail(did, pid) {
  if (!deleteGuard()) return;
  Store.deleteDocument(did); showToast('已删除'); renderProjectDetail(pid);
}

/* ========== Tab8: 退出信息 ========== */
function renderExitTab(pid) {
  const p = Store.getProjects().find(x => x.id === pid);
  const ex = Store.getExitInfoByProject(pid);
  const canEdit = Auth.canEdit();

  if (p.status === 'exited' || p.status === 'partial' || ex) {
    return `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <h3 style="font-size:1rem;color:var(--gray-800);">🚪 退出信息</h3>
        ${canEdit ? `<button class="btn btn-outline btn-sm" onclick="showExitForm('${pid}')">${ex ? '编辑' : '录入退出信息'}</button>` : ''}
      </div>
      ${ex ? `
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-icon blue">📤</div><div><div class="stat-value" style="font-size:1rem;">${ex.exitPath || '【待补充】'}</div><div class="stat-label">退出路径</div></div></div>
        <div class="stat-card"><div class="stat-icon green">💰</div><div><div class="stat-value">${fmtAmount(ex.exitAmount)}万</div><div class="stat-label">退出金额</div></div></div>
        <div class="stat-card"><div class="stat-icon cyan">📊</div><div><div class="stat-value">${ex.exitRatio ? ex.exitRatio + '%' : '【待补充】'}</div><div class="stat-label">退出比例</div></div></div>
        <div class="stat-card"><div class="stat-icon orange">📈</div><div><div class="stat-value">${ex.irr ? ex.irr + '%' : '【待补充】'}</div><div class="stat-label">IRR</div></div></div>
        <div class="stat-card"><div class="stat-icon green">💵</div><div><div class="stat-value">${fmtAmount(ex.dividends)}万</div><div class="stat-label">累计分红</div></div></div>
        <div class="stat-card"><div class="stat-icon blue">🔄</div><div><div class="stat-value">${fmtAmount(ex.recovery)}万</div><div class="stat-label">累计回收</div></div></div>
      </div>
      ${ex.notes ? `<div style="background:var(--gray-50);padding:16px;border-radius:8px;border-left:4px solid var(--primary);white-space:pre-wrap;">${ex.notes}</div>` : ''}
      ` : '<div class="empty-state"><div class="empty-state-text">点击上方按钮录入退出信息</div></div>'}
    `;
  } else {
    return `
      <div class="empty-state">
        <div class="empty-state-icon">🚪</div>
        <div class="empty-state-text">当前项目状态为「${STATUS_MAP[p.status]?.label || p.status}」，暂无退出信息</div>
        ${canEdit ? `<button class="btn btn-primary" style="margin-top:12px;" onclick="showExitForm('${pid}')">录入退出信息</button>` : ''}
      </div>
    `;
  }
}

function showExitForm(pid) {
  const ex = Store.getExitInfoByProject(pid);
  openModal(ex ? '编辑退出信息' : '录入退出信息', `
    <div class="form-row">
      <div class="form-group"><label>退出路径</label>
        <select id="exf_path">${['IPO上市','并购退出','老股转让','回购','清算','部分退出'].map(t => `<option value="${t}" ${ex?.exitPath?.includes(t)?'selected':''}>${t}</option>`).join('')}</select>
      </div>
      <div class="form-group"><label>退出日期</label><input type="date" id="exf_date" value="${ex?.exitDate || ''}"></div>
    </div>
    <div class="form-row-3">
      <div class="form-group"><label>退出比例(%)</label><input type="number" step="0.1" id="exf_ratio" value="${ex?.exitRatio ?? ''}"></div>
      <div class="form-group"><label>退出金额(万元)</label><input type="number" id="exf_amount" value="${ex?.exitAmount ?? ''}"></div>
      <div class="form-group"><label>IRR(%)</label><input type="number" step="0.1" id="exf_irr" value="${ex?.irr ?? ''}"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>累计分红(万元)</label><input type="number" id="exf_dividends" value="${ex?.dividends ?? ''}"></div>
      <div class="form-group"><label>累计回收(万元)</label><input type="number" id="exf_recovery" value="${ex?.recovery ?? ''}"></div>
    </div>
    <div class="form-group"><label>退出说明</label><textarea id="exf_notes" rows="3">${ex?.notes || ''}</textarea></div>
  `, `
    <button class="btn btn-outline" onclick="closeModal()">取消</button>
    <button class="btn btn-primary" onclick="saveExitInfo('${pid}')">保存</button>
  `);
}

function saveExitInfo(pid) {
  const data = {
    exitPath: document.getElementById('exf_path').value,
    exitDate: document.getElementById('exf_date').value,
    exitRatio: Number(document.getElementById('exf_ratio').value) || null,
    exitAmount: Number(document.getElementById('exf_amount').value) || null,
    irr: Number(document.getElementById('exf_irr').value) || null,
    dividends: Number(document.getElementById('exf_dividends').value) || null,
    recovery: Number(document.getElementById('exf_recovery').value) || null,
    notes: document.getElementById('exf_notes').value.trim()
  };
  Store.setExitInfo(pid, data);
  // 更新项目状态
  if (data.exitRatio >= 100) { Store.updateProject(pid, { status: 'exited' }); }
  else if (data.exitRatio > 0) { Store.updateProject(pid, { status: 'partial' }); }
  closeModal(); showToast('退出信息已保存'); renderProjectDetail(pid);
}

let currentPage = 'dashboard';
let currentDetailProjectId = null;

// 页面标题映射
const PAGE_TITLES = {
  dashboard: '投后智驾舱',
  projects: '项目台账',
  quarterly: '季度经营跟踪',
  risks: '风险台账',
  documents: '文档附件库',

  reportGen: '投后报告生成',

};

// 渲染函数映射
const PAGE_RENDERERS = {
  dashboard: renderDashboard,
  projects: renderProjects,
  quarterly: renderQuarterly,
  risks: renderRisks,
  documents: renderDocuments,
  investReturns: renderInvestReturns,
  reportGen: renderReportGenerator,
  users: renderUsers,
  projectDetail: () => renderProjectDetail(currentDetailProjectId)
};

// 项目详情导航
function navigateToDetail(projectId, e) {
  if (e) e.preventDefault();
  currentDetailProjectId = projectId;
  detailCurrentTab = 'basic';
  currentPage = 'projectDetail';
  const pName = getProjectName(projectId);
  document.getElementById('pageTitle').textContent = pName + ' - 项目详情';

  document.querySelector('[data-page="projects"]')?.classList.add('active');

// 初始化
document.addEventListener('DOMContentLoaded', () => {
  CloudStore.init(); // 恢复 Gist ID
  Store.initDemoData();

  // 尝试恢复登录状态
  if (Auth.restore()) {
    showApp();
    loadFromCloud(); // 自动从云端加载
  }
});

// ===== 云端同步逻辑 =====
async function loadFromCloud() {
  if (!CloudStore.token || CloudStore.token.includes('xxxx')) {
    showToast('云端未配置，请在「系统配置」中填写 GitHub Token', 'warning');
    return;
  }
  const cloud = await CloudStore.fetch();
  if (!cloud) return;
  // 用云端数据覆盖本地
  const keys = ['projects','quarterly','risks','documents','users','investReturns','todos','boardMeetings','interviews','bizEvents','exitInfo'];
  keys.forEach(k => { if (cloud[k]) localStorage.setItem('pims_' + k, JSON.stringify(cloud[k])); });
  showToast('已从云端同步数据');
  renderPage();
}

let _cloudSaveTimer = null;
function syncToCloud() {
  if (!CloudStore.token || CloudStore.token.includes('xxxx')) return;
  if (_cloudSaveTimer) clearTimeout(_cloudSaveTimer);
  _cloudSaveTimer = setTimeout(async () => {
    const keys = ['projects','quarterly','risks','documents','users','investReturns','todos','boardMeetings','interviews','bizEvents','exitInfo'];
    const data = { updatedAt: new Date().toISOString() };
    keys.forEach(k => { data[k] = JSON.parse(localStorage.getItem('pims_' + k) || '[]'); });
    const ok = await CloudStore.save(data);
    if (ok) showToast('已保存到云端');
  }, 1500);
}

// 包装：数据变更后自动同步云端
const _wrap = (obj, fnName) => {
  const orig = obj[fnName];
  obj[fnName] = function(...args) { const r = orig.apply(this, args); syncToCloud(); return r; };
};
_wrap(Store,'addProject'); _wrap(Store,'updateProject'); _wrap(Store,'deleteProject');
_wrap(Store,'addQuarterly'); _wrap(Store,'deleteQuarterly');
_wrap(Store,'addRisk'); _wrap(Store,'deleteRisk');
_wrap(Store,'addDocument'); _wrap(Store,'deleteDocument');
_wrap(Store,'addInvestReturn'); _wrap(Store,'deleteInvestReturn');
_wrap(Store,'addTodo'); _wrap(Store,'deleteTodo');

// 登录
function handleLogin(e) {
  e.preventDefault();
  const username = document.getElementById('loginUser').value.trim();
  const role = document.getElementById('loginRole').value;
  if (!username) return false;

  Auth.login(username, role);
  showApp();
  return false;
}

// 登出
function handleLogout() {
  Auth.logout();
  document.getElementById('app').classList.add('hidden');
  document.getElementById('loginPage').classList.remove('hidden');
}

// 显示主应用
function showApp() {
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');

  // 更新用户信息
  const user = Auth.currentUser;
  document.getElementById('userName').textContent = user.username;
  document.getElementById('userRoleLabel').textContent = Auth.getRoleLabel();
  document.getElementById('userAvatar').textContent = user.username.charAt(0).toUpperCase();

  // 权限控制：普通人员隐藏用户管理入口
  const usersNav = document.querySelector('[data-page="users"]');
  if (usersNav) {
    usersNav.style.display = Auth.canManageUsers() ? '' : 'none';
  }

  // 更新时间
  updateTime();
  setInterval(updateTime, 60000);

  // 导航到首页
  navigateTo('dashboard');
}

// 页面导航
function navigateTo(page, e) {
  if (e) e.preventDefault();
  currentPage = page;

  // 更新侧边栏active状态
  document.querySelectorAll('.nav-item').forEach(item => {
    item.classList.toggle('active', item.dataset.page === page);
  });

  // 更新标题
  document.getElementById('pageTitle').textContent = PAGE_TITLES[page] || page;

  // 渲染页面
  const renderer = PAGE_RENDERERS[page];
  if (renderer) renderer();
}

// 更新时间
function updateTime() {
  const now = new Date();
  const el = document.getElementById('currentTime');
  if (el) {
    el.textContent = now.toLocaleDateString('zh-CN', {
      year: 'numeric', month: '2-digit', day: '2-digit',
      weekday: 'short', hour: '2-digit', minute: '2-digit'
    });
  }
}

// 侧边栏切换
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// 点击模态框外部关闭
document.addEventListener('click', (e) => {
  if (e.target.id === 'modalOverlay') closeModal();
});

// ESC 关闭模态框
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});
